name: Desktop

on:
  push:
    branches: [desktop-poc]
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  mac-dmg:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build Mac Python prefix
        run: bash desktop/build_python.sh

      - name: Install Electron
        working-directory: desktop
        run: npm ci

      - name: Write the notary API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Pack the DMG and zip
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -f "$RUNNER_TEMP/AuthKey.p8" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --mac
          fi

      - name: Upload the DMG and zip
        uses: actions/upload-artifact@v4
        with:
          name: open-sustainability-analyst-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*mac.zip
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows Python prefix
        shell: bash
        run: bash desktop/build_python.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import numpy and fitz from a moved prefix
        shell: bash
        run: python desktop/smoke_relocate.py

      - name: Install Electron
        working-directory: desktop
        run: npm ci

      - name: Pack the NSIS installer
        working-directory: desktop
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder --win

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: open-sustainability-analyst-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
