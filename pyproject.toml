[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-analyst"
version = "0.8.0rc"
description = "Open Sustainability Analyst - benchmark evaluation, error analysis, and dataset loading for retrieval evaluation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["report_analyst", "report_analyst.*"]

[tool.setuptools.package-data]
"report_analyst" = ["data/*.csv", "config/datasets/*.yaml"]

[tool.isort]
profile = "black"
line_length = 127
skip = [".git", ".hg", "venv", "venv2", "node_modules", "report_analyst_enterprise", "__pycache__", "htmlcov", "*.egg-info", "report_analyst/core/benchmark/02_classification_calibration.py"]

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
exclude = '''
/(
    \.git
    | \.hg
    | \.venv
    | venv
    | venv2
    | node_modules
    | report_analyst_enterprise
    | __pycache__
    | \.pytest_cache
    | htmlcov
)/
'''

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 127
src = ["report_analyst", "tests"]

[tool.ruff.lint]
# TODO: expand toward select = ["ALL"] fix-on-touch (docstrings, typing, complexity).
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "S",    # bandit / security
    "B",    # bugbear
    "BLE",  # blind except
    "ASYNC", # async correctness
    "RUF",  # ruff-specific (incl. security helpers)
]
ignore = [
    "COM812",  # trailing comma (formatter)
    "ISC001",  # import sorting conflicts with formatter
    "S101",    # assert — allowed in tests via per-file-ignores
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "report_analyst",
    "report_analyst_api",
    "report_analyst_enterprise",
    "report_analyst_jobs",
    "report_analyst_search_backend",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
max-branches = 12

[tool.ruff.format]
quote-style = "double"
